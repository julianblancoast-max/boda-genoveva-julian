<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Divider(){
  return <div className="divider"><div className="div-line"/><div className="div-dot"/><div className="div-line"/></div>;
}

function scrollToContent(){
  setTimeout(()=>{
    const el = document.getElementById("main-content");
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }, 60);
}

function App(){
  const [tab, setTab] = useState(initialTab);
  const [rsvps, setRsvps] = useState([]);
  const [fotos, setFotos] = useState([]);
  const [form, setForm] = useState({nombre:"", apellido:"", asistencia:"si"});
  const [submitted, setSubmitted] = useState(false);
  const [loading, setLoading] = useState(false);
  const [adminMode, setAdminMode] = useState(false);
  const [showLogin, setShowLogin] = useState(false);
  const [pass, setPass] = useState("");
  const [passErr, setPassErr] = useState(false);
  const [filter, setFilter] = useState("todos");
  const [copied, setCopied] = useState(false);
  const [uploadStatus, setUploadStatus] = useState("");
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);
  const [lightbox, setLightbox] = useState(null);
  const [drag, setDrag] = useState(false);
  const taps = useRef(0);
  const qrRef = useRef(null);
  const qrGenerated = useRef(false);

  useEffect(()=>{
    const unsub = db.collection("rsvps").orderBy("ts","desc").onSnapshot(snap=>{
      setRsvps(snap.docs.map(d=>({id:d.id,...d.data()})));
    },()=>{});
    const unsub2 = db.collection("fotos").orderBy("ts","desc").onSnapshot(snap=>{
      setFotos(snap.docs.map(d=>({id:d.id,...d.data()})));
    },()=>{});
    return ()=>{unsub();unsub2();};
  },[]);

  useEffect(()=>{
    if(tab==="qr" && qrRef.current && !qrGenerated.current){
      qrRef.current.innerHTML="";
      new QRCode(qrRef.current,{
        text: WEDDING_URL+"?tab=fotos",
        width:220, height:220,
        colorDark:"#2A2118", colorLight:"#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      qrGenerated.current=true;
    }
  },[tab]);

  function openTab(t){
    setTab(t);
    scrollToContent();
  }

  async function uploadFile(file){
    const isVideo = file.type.startsWith("video/");
    const resourceType = isVideo ? "video" : "image";
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_PRESET);
    formData.append("folder", "boda");
    const xhr = new XMLHttpRequest();
    xhr.upload.onprogress = (e)=>{
      if(e.lengthComputable) setProgress(Math.round(e.loaded/e.total*100));
    };
    return new Promise((resolve,reject)=>{
      xhr.onload = ()=>{ if(xhr.status===200){resolve(JSON.parse(xhr.responseText));}else{reject(new Error("Upload failed"));} };
      xhr.onerror = ()=>reject(new Error("Network error"));
      xhr.open("POST",`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/${resourceType}/upload`);
      xhr.send(formData);
    });
  }

  async function handleFiles(files){
    if(!files||files.length===0) return;
    setUploading(true);
    setProgress(0);
    let ok=0, fail=0;
    for(let i=0;i<files.length;i++){
      const file=files[i];
      const isVideo=file.type.startsWith("video/");
      const isImage=file.type.startsWith("image/");
      if(!isVideo&&!isImage){fail++;continue;}
      setUploadStatus(`Subiendo ${i+1} de ${files.length}...`);
      try{
        const res=await uploadFile(file);
        await db.collection("fotos").add({
          url:res.secure_url, publicId:res.public_id,
          tipo:isVideo?"video":"imagen",
          ts:firebase.firestore.FieldValue.serverTimestamp(),
          fecha:new Date().toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})
        });
        ok++;
      }catch(e){fail++;}
    }
    setUploading(false);
    setProgress(0);
    if(ok>0) setUploadStatus(`✓ ${ok} archivo${ok>1?"s":""} subido${ok>1?"s":""}. ¡Gracias!`);
    if(fail>0) setUploadStatus(`${ok} subidos, ${fail} fallidos.`);
    setTimeout(()=>setUploadStatus(""),4000);
  }

  async function handleSubmit(){
    if(!form.nombre.trim()||!form.apellido.trim()) return;
    setLoading(true);
    try{
      await db.collection("rsvps").add({
        nombre:form.nombre.trim(), apellido:form.apellido.trim(),
        asistencia:form.asistencia,
        ts:firebase.firestore.FieldValue.serverTimestamp(),
        fecha:new Date().toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})
      });
      setSubmitted(true);
    }catch(e){alert("Error. Inténtalo de nuevo.");}
    setLoading(false);
  }

  function handleCopy(){
    navigator.clipboard.writeText(IBAN).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);});
  }

  function handleFooterTap(){
    taps.current++;
    if(taps.current>=5){setShowLogin(true);taps.current=0;}
  }

  function handleLogin(){
    if(pass===ADMIN_PASS){setAdminMode(true);setShowLogin(false);setPassErr(false);}
    else setPassErr(true);
  }

  // ── ADMIN ──
  if(adminMode){
    const conf=rsvps.filter(r=>r.asistencia==="si");
    const dec=rsvps.filter(r=>r.asistencia==="no");
    const list=filter==="todos"?rsvps:filter==="si"?conf:dec;
    return(
      <div className="admin-wrap">
        <div className="admin-top">
          <div>
            <div className="admin-top-title">Panel de invitados</div>
            <div className="admin-top-sub">{WEDDING.novia} &amp; {WEDDING.novio} · 12 Sep 2026</div>
          </div>
          <button className="btn-out" onClick={()=>setAdminMode(false)}>Salir</button>
        </div>
        <div className="admin-body">
          <div className="stats">
            <div className="stat"><div className="stat-n">{rsvps.length}</div><div className="stat-l">Respuestas</div></div>
            <div className="stat"><div className="stat-n" style={{color:"#3A6A34"}}>{conf.length}</div><div className="stat-l">Confirmados</div></div>
            <div className="stat"><div className="stat-n" style={{color:"#6A3434"}}>{dec.length}</div><div className="stat-l">No asisten</div></div>
          </div>
          <div className="ftabs">
            {[["todos","Todos"],["si","✓ Confirmados"],["no","✗ No asisten"]].map(([v,l])=>(
              <button key={v} className={`ftab ${filter===v?"active":""}`} onClick={()=>setFilter(v)}>{l}</button>
            ))}
          </div>
          {list.length===0?<div className="gtable"><div className="empty">Sin respuestas todavía</div></div>:(
            <div className="gtable">
              <div className="g-head">
                <div className="th">Nombre</div><div className="th">Apellido</div>
                <div className="th">Asistencia</div><div className="th th-date">Respondido</div>
              </div>
              {list.map(r=>(
                <div key={r.id} className="g-row">
                  <div className="td">{r.nombre}</div><div className="td">{r.apellido}</div>
                  <div><span className={`badge badge-${r.asistencia}`}>{r.asistencia==="si"?"✓ Asiste":"✗ No asiste"}</span></div>
                  <div className="td-sm td-date">{r.fecha||"—"}</div>
                </div>
              ))}
            </div>
          )}
          {rsvps.length>0&&(
            <div style={{marginTop:20,textAlign:"right"}}>
              <button onClick={()=>{
                const csv="Nombre,Apellido,Asistencia,Fecha\n"+rsvps.map(r=>`${r.nombre},${r.apellido},${r.asistencia},${r.fecha||""}`).join("\n");
                const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="invitados.csv";a.click();
              }} style={{background:"none",border:"1px solid #D4C4B0",padding:"10px 22px",cursor:"pointer",fontFamily:"Montserrat,sans-serif",fontSize:10,letterSpacing:2,textTransform:"uppercase",color:"#8A7A6A",fontWeight:500}}>
                Exportar CSV
              </button>
            </div>
          )}
          <div style={{marginTop:48}}>
            <div style={{fontFamily:"Cormorant Garamond,serif",fontSize:28,fontWeight:300,color:"#2A2118",marginBottom:16}}>
              Fotos y vídeos — {fotos.length} archivos
            </div>
            {fotos.length>0&&(
              <div className="gallery-grid">
                {fotos.map(f=>(
                  <div key={f.id} className="gallery-item" onClick={()=>setLightbox(f)}>
                    {f.tipo==="video"?<><video src={f.url} muted/><span className="vid-badge">VIDEO</span></>:<img src={f.url} alt="" loading="lazy"/>}
                    <div className="overlay"/>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
        {lightbox&&(
          <div className="lightbox" onClick={()=>setLightbox(null)}>
            <button className="lightbox-close" onClick={()=>setLightbox(null)}>✕</button>
            {lightbox.tipo==="video"
              ?<video src={lightbox.url} controls autoPlay style={{maxWidth:"100%",maxHeight:"90vh"}} onClick={e=>e.stopPropagation()}/>
              :<img src={lightbox.url} alt="" onClick={e=>e.stopPropagation()}/>}
            <a href={lightbox.url} download target="_blank" rel="noreferrer">
              <button className="lightbox-dl" style={{position:"absolute",bottom:20,right:20,background:"#B4915A",color:"#fff",border:"none",padding:"10px 20px",fontFamily:"Montserrat,sans-serif",fontSize:10,letterSpacing:2,textTransform:"uppercase",cursor:"pointer",fontWeight:600}} onClick={e=>e.stopPropagation()}>Descargar</button>
            </a>
          </div>
        )}
      </div>
    );
  }

  // ── LOGIN ──
  if(showLogin){
    return(
      <div className="admin-login-wrap">
        <div className="admin-login">
          <div className="login-title">Acceso privado</div>
          <div className="login-sub">Introduce la contraseña</div>
          <input className="form-input" type="password" placeholder="Contraseña" value={pass}
            onChange={e=>{setPass(e.target.value);setPassErr(false)}}
            onKeyDown={e=>e.key==="Enter"&&handleLogin()}/>
          {passErr&&<div className="err-txt">Contraseña incorrecta</div>}
          <button className="btn-main" style={{marginTop:28}} onClick={handleLogin}>Entrar</button>
          <button onClick={()=>setShowLogin(false)} style={{display:"block",margin:"16px auto 0",background:"none",border:"none",fontSize:12,color:"#B4915A",cursor:"pointer",fontWeight:500}}>Volver</button>
        </div>
      </div>
    );
  }

  // ── GUEST VIEW ──
  return(
    <div style={{background:"#F8F4EE",minHeight:"100vh"}}>

      {/* HERO - full screen with confirm button */}
      <section className="hero">
        <div className="hero-bg"/>
        <div className="hero-ring" style={{width:360,height:360}}/>
        <div className="hero-ring" style={{width:520,height:520}}/>
        <div className="hero-ring" style={{width:680,height:680,borderColor:"rgba(180,145,90,.06)"}}/>
        <div className="hero-content">
          <div className="hero-label fu fu1">Os invitamos a nuestra boda</div>
          <div className="fu fu2">
            <h1 className="hero-names">{WEDDING.novia}<span className="hero-amp">&</span>{WEDDING.novio}</h1>
          </div>
          <Divider/>
          <div className="hero-date fu fu3">{WEDDING.fecha}</div>
          <div className="hero-place fu fu4">{WEDDING.lugar} · {WEDDING.ubicacion} · {WEDDING.hora}</div>

          {/* BIG CONFIRM BUTTON - right here, visible without scrolling */}
          <div className="fu fu4" style={{display:"flex",justifyContent:"center"}}>
            <button className="btn-confirm-hero" onClick={()=>openTab("confirmar")}>
              Confirmar asistencia
            </button>
          </div>

          {/* SECONDARY NAV - smaller buttons below */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px",maxWidth:"400px",margin:"32px auto 0"}} className="fu fu4">
            {[
              {id:"programa", label:"El Día"},
              {id:"fotos", label:"Fotos"},
              {id:"regalos", label:"Regalos"},
            ].map(s=>(
              <button key={s.id}
                onClick={()=>openTab(s.id)}
                style={{
                  background:"transparent",
                  border:"none",
                  padding:"10px 4px",
                  fontFamily:"Cormorant Garamond,serif",
                  fontSize:"22px",
                  fontWeight: tab===s.id ? 400 : 300,
                  fontStyle:"italic",
                  letterSpacing:"1px",
                  color: tab===s.id ? "#2A2118" : "#9A8474",
                  cursor:"pointer",
                  textAlign:"center",
                  transition:"color .2s",
                  borderBottom: tab===s.id ? "1px solid #B4915A" : "1px solid transparent"
                }}>
                {s.label}
              </button>
            ))}
          </div>
        </div>
      </section>

      {/* CONTENT SECTIONS */}
      <div id="main-content">

        {/* CONFIRMAR */}
        {tab==="confirmar"&&(
          <div className="section">
            <h2 className="sec-title">Confirmación</h2>
            <div className="sec-sub">Haznos saber si podrás acompañarnos</div>
            {submitted?(
              <div className="success">
                <span className="success-icon">♡</span>
                <div className="success-title">{form.asistencia==="si"?"¡Nos vemos pronto!":"Lo entendemos, te echaremos de menos"}</div>
                <p className="success-txt">{form.asistencia==="si"?`Hemos recibido tu confirmación, ${form.nombre}. Estamos deseando compartir este día contigo.`:`Gracias por avisarnos, ${form.nombre}. Estarás en nuestros pensamientos.`}</p>
              </div>
            ):(
              <div className="rsvp-card">
                <div className="form-group">
                  <label className="form-label">Nombre</label>
                  <input className="form-input" placeholder="Tu nombre" value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))}/>
                </div>
                <div className="form-group">
                  <label className="form-label">Apellido</label>
                  <input className="form-input" placeholder="Tu apellido" value={form.apellido} onChange={e=>setForm(f=>({...f,apellido:e.target.value}))}/>
                </div>
                <div className="form-group">
                  <label className="form-label">¿Asistirás?</label>
                  <div className="attend-opts">
                    {[["si","✓  Sí, allí estaré"],["no","✗  No podré asistir"]].map(([v,l])=>(
                      <label key={v} className="attend-opt">
                        <input type="radio" name="asist" value={v} checked={form.asistencia===v} onChange={()=>setForm(f=>({...f,asistencia:v}))}/>
                        <span className="attend-lbl">{l}</span>
                      </label>
                    ))}
                  </div>
                </div>
                <button className="btn-main" disabled={!form.nombre.trim()||!form.apellido.trim()||loading} onClick={handleSubmit}>{loading?"Enviando...":"Confirmar respuesta"}</button>
              </div>
            )}
          </div>
        )}

        {/* PROGRAMA */}
        {tab==="programa"&&(
          <div className="section">
            <h2 className="sec-title">El día</h2>
            <div className="sec-sub">Programa de la celebración</div>
            {PROGRAMA.map((p,i)=>(
              <div key={i} className="sched-item">
                <div className="sched-time">{p.hora}</div>
                <div className="sched-line"><div className="sched-dot"/></div>
                <div style={{paddingBottom:6}}><div className="sched-ev">{p.ev}</div><div className="sched-desc">{p.desc}</div></div>
              </div>
            ))}
          </div>
        )}

        {/* FOTOS */}
        {tab==="fotos"&&(
          <div className="fotos-section">
            <h2 className="sec-title">Fotos & Vídeos</h2>
            <div className="sec-sub">Comparte vuestros momentos</div>
            <div className={`upload-zone ${drag?"drag":""}`}
              onDragOver={e=>{e.preventDefault();setDrag(true)}}
              onDragLeave={()=>setDrag(false)}
              onDrop={e=>{e.preventDefault();setDrag(false);handleFiles(e.dataTransfer.files)}}>
              <input type="file" accept="image/*,video/*" multiple onChange={e=>handleFiles(e.target.files)} disabled={uploading}/>
              <span className="upload-icon">📷</span>
              <div className="upload-title">{uploading?"Subiendo...":"Sube tus fotos y vídeos"}</div>
              <div className="upload-sub">{uploading?"Por favor espera":"Toca aquí para subir · Imágenes y vídeos"}</div>
              <div className={`upload-progress ${uploading?"show":""}`}>
                <div className="upload-progress-bar" style={{width:progress+"%"}}/>
              </div>
              {uploadStatus&&<div className="upload-status">{uploadStatus}</div>}
            </div>
            {fotos.length===0?(
              <div className="gallery-empty">Aún no hay fotos. ¡Sé el primero en subir!</div>
            ):(
              <div className="gallery-grid">
                {fotos.map(f=>(
                  <div key={f.id} className="gallery-item" onClick={()=>setLightbox(f)}>
                    {f.tipo==="video"?<><video src={f.url} muted/><span className="vid-badge">VIDEO</span></>:<img src={f.url} alt="" loading="lazy"/>}
                    <div className="overlay"/>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* REGALOS */}
        {tab==="regalos"&&(
          <div className="section">
            <h2 className="sec-title">Regalos</h2>
            <div className="sec-sub">Con todo nuestro amor</div>
            <div className="regalo-card">
              <p className="regalo-msg">Vuestra presencia es el mejor regalo que nos podéis hacer.<br/>Pero por si acaso, aquí están nuestros datos:</p>
              <div className="divider" style={{margin:"0 auto 36px"}}><div className="div-line"/><div className="div-dot"/><div className="div-line"/></div>
              <div className="iban-label">Número de cuenta</div>
              <div className="iban-box">
                <div className="iban-number">{IBAN}</div>
                <div className="iban-name">A nombre de {TITULAR}</div>
              </div>
              <button className="copy-btn" onClick={handleCopy}>{copied?"✓ Copiado":"Copiar IBAN"}</button>
              {copied&&<div style={{fontSize:12,color:"#4A7A44",marginTop:10,fontWeight:500}}>¡IBAN copiado!</div>}
            </div>
          </div>
        )}

        {/* QR - hidden, only for us */}
        {tab==="qr"&&(
          <div className="qr-page">
            <h2 className="sec-title">Código QR</h2>
            <div className="sec-sub">Para imprimir en las mesas</div>
            <div className="qr-box">
              <div id="qrcode" ref={qrRef}/>
              <div style={{fontFamily:"Cormorant Garamond,serif",fontSize:16,color:"#B4915A",marginTop:20,letterSpacing:2}}>{WEDDING.novia} & {WEDDING.novio}</div>
              <div style={{fontSize:11,color:"#8A7A6A",marginTop:6,letterSpacing:1}}>Sube tus fotos de la boda</div>
            </div>
            <div style={{fontSize:12,color:"#8A7A6A",marginBottom:24,lineHeight:1.8}}>
              Imprime este QR y colócalo en las mesas.<br/>Los invitados lo escanean y acceden directamente a subir fotos.
            </div>
            <button className="qr-print-btn" onClick={()=>window.print()}>Imprimir QR</button>
          </div>
        )}

      </div>

      {/* LIGHTBOX */}
      {lightbox&&(
        <div className="lightbox" onClick={()=>setLightbox(null)}>
          <button className="lightbox-close" onClick={()=>setLightbox(null)}>✕</button>
          {lightbox.tipo==="video"
            ?<video src={lightbox.url} controls autoPlay style={{maxWidth:"100%",maxHeight:"90vh"}} onClick={e=>e.stopPropagation()}/>
            :<img src={lightbox.url} alt="" onClick={e=>e.stopPropagation()}/>}
        </div>
      )}

      {/* FOOTER */}
      <div className="page-footer">
        <span className="footer-names">{WEDDING.novia} & {WEDDING.novio} · {WEDDING.fecha}</span>
        <span className="footer-tap" onClick={handleFooterTap}>·</span>
        <span style={{display:"block",fontSize:9,color:"rgba(180,145,90,0.18)",marginTop:4,cursor:"pointer",letterSpacing:1}} onClick={()=>openTab("qr")}>QR mesas</span>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
